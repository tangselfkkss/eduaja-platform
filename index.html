  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const dots = Array.from(document.querySelectorAll(".dot"));
      let activeDot = 0;
      function updateDots(direction) {
        dots[activeDot].classList.remove("active");
        activeDot = (activeDot + direction + dots.length) % dots.length;
        dots[activeDot].classList.add("active");
      }
      document.getElementById("previous-slide").addEventListener("click", () => updateDots(-1));
      document.getElementById("next-slide").addEventListener("click", () => updateDots(1));

      const idButton = document.getElementById("lang-id");
      const enButton = document.getElementById("lang-en");
      function setLanguage(active, inactive) {
        active.classList.add("bg-[#159a3b]", "font-bold");
        inactive.classList.remove("bg-[#159a3b]", "font-bold");
      }
      idButton.addEventListener("click", () => setLanguage(idButton, enButton));
      enButton.addEventListener("click", () => setLanguage(enButton, idButton));
    });
  </script>
